{% extends "base.html" %}
{% block title %}Open New Sub-Account &mdash; Member {{ member.id }}{% endblock %}
{% block content %}
<table class="row" width="100%"><tr class="row"><td class="cell panel-title">Open New Sub-Account for {{ member.name }} (Member {{ member.id }})</td></tr></table>

{% if error %}
<table class="row" width="100%"><tr class="row"><td class="cell error-text">{{ error }}</td></tr></table>
{% endif %}

<table class="row" width="100%"><tr class="row"><td class="cell">
  <form name="subAccountForm" method="post" action="/members/{{ member.id }}/sub-accounts">
    <table class="row">
      <tr class="row">
        <td class="cell field-label">Account Type:</td>
        <td class="cell">
          <select name="account_type" aria-label="New account type">
            <option value="checking" {% if account_type == 'checking' %}selected{% endif %}>Checking</option>
            <option value="savings" {% if account_type == 'savings' %}selected{% endif %}>Savings</option>
          </select>
        </td>
      </tr>
      <tr class="row">
        <td class="cell field-label">Initial Deposit ($):</td>
        <td class="cell"><input type="text" name="initial_deposit" value="{{ initial_deposit|default('0') }}" aria-label="Initial deposit in dollars"></td>
        <td class="cell"><a class="action" href="#" onclick="document.forms['subAccountForm'].submit(); return false;">Continue</a></td>
      </tr>
    </table>
  </form>
</td></tr></table>
<table class="row" width="100%"><tr class="row"><td class="cell">
  <a class="action" href="/members/{{ member.id }}">Cancel</a>
</td></tr></table>
{% endblock %}
