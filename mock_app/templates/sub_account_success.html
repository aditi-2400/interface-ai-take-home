{% extends "base.html" %}
{% block title %}Sub-Account Opened{% endblock %}
{% block content %}
<table class="row" width="100%"><tr class="row"><td class="cell panel-title notice-text">Sub-Account Opened</td></tr></table>
<table class="row" width="100%">
<tr class="row"><td class="cell field-label">New Account ID:</td><td class="cell">{{ account.id }}</td></tr>
<tr class="row"><td class="cell field-label">Type:</td><td class="cell">{{ account.account_type|capitalize }}</td></tr>
<tr class="row"><td class="cell field-label">Balance:</td><td class="cell">{{ account.balance_cents|money }}</td></tr>
</table>
<table class="row" width="100%"><tr class="row"><td class="cell">
  <a class="action" href="/members/{{ account.member_id }}">Back to Member</a>
</td></tr></table>
{% endblock %}
